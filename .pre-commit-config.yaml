repos:
  # ruff 直接用项目环境里的那一份（uv.lock），不让 pre-commit 另装副本：
  # 钩子版本要手工跟 uv.lock 同步，漏一次就和 CI 的 `uv run ruff check`
  # 变成两个不同的 linter（v0.8.6 与 0.17.4 曾长期并存）。
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(src|tests|scripts)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # star-history 工作流自动生成，不带结尾换行
        exclude: ^docs/assets/star-history(-dark)?\.svg$
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: mixed-line-ending
