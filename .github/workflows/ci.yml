name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  p0_quality_gate:
    name: P0 quality baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run P0 quality baseline
        run: uv run python scripts/quality_baseline.py

      - name: P0 smoke contract (offline)
        env:
          BOSS_SMOKE_DRY_RUN: "1"
        run: uv run python scripts/smoke_p0.py

      - name: MCP eval scenarios (offline fixtures)
        run: uv run python evals/run_eval.py --mode fixture --results-dir "${RUNNER_TEMP}/evals"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --tb=short --cov=boss_agent_cli --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          # 公开仓库支持 tokenless 上传，token 配置后可获得完整功能
          # 若 secret 缺失，action 会降级为 tokenless，不阻塞 CI

      - name: Verify CLI loads
        run: uv run python -c "from boss_agent_cli.main import cli; print('CLI loaded')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Compile check all modules
        run: uv run python -m compileall src/boss_agent_cli/ -q

      - name: Ruff lint
        run: uv run ruff check src/

      - name: Check critical imports
        run: |
          uv run python -c "
          from boss_agent_cli.auth.manager import AuthManager
          from boss_agent_cli.api.client import BossClient
          from boss_agent_cli.cache.store import CacheStore
          from boss_agent_cli.commands.schema import schema_cmd
          print('All critical imports OK')
          "

  typecheck:
    runs-on: ubuntu-latest
    # 静态类型检查：baseline 已清零，切为 blocking
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run mypy
        run: uv run mypy src/boss_agent_cli

  docker:
    # 容器镜像必须每次构建，否则会像此前那个无人引用的 Dockerfile 一样静默腐烂。
    #
    # 刻意用 runner 自带的 docker build，不上 buildx / GHA 缓存：docker-container
    # driver 需要额外从 Docker Hub 拉 moby/buildkit，`# syntax=` 前端又要再拉一次
    # docker/dockerfile——两者都曾在此 job 上因 Docker Hub 超时而假红。构建本身只要
    # 几十秒，省下的缓存收益远不及这两个外部依赖带来的偶发失败。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t boss-agent-cli:ci .

      - name: Verify the CLI entry point and JSON envelope
        run: |
          docker run --rm --entrypoint boss boss-agent-cli:ci --version
          docker run --rm --entrypoint boss boss-agent-cli:ci --json schema --format native \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['ok'], d; print('schema commands:', len(d['data']['commands']))"

      - name: Verify the MCP server handshake over stdio
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            | docker run --rm -i boss-agent-cli:ci \
            | python3 -c "import sys, json; d = json.loads(sys.stdin.readline()); assert d['result']['serverInfo']['name'] == 'boss-agent-cli', d; print('MCP initialize ok')"

      - name: Verify it runs as non-root
        run: |
          test "$(docker run --rm --entrypoint id boss-agent-cli:ci -u)" != "0"
