name: Update Contributors

on:
  # 合并即 push 到 master；push 事件本就能申请写权限，不需要 pull_request_target。
  # GitHub 公共仓库从 2026-12-02 起默认阻止 pull_request_target（Issue #1322）。
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 默认检出触发本次运行的 master 提交。
          # create-pull-request 推分支依赖这里留下的凭据。
          persist-credentials: true

      - name: Generate contributors SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_contributors.py

      # master 为保护分支,且 GITHUB_TOKEN 发起的 PR 不会触发必需检查,
      # 因此有变更时开 PR,由维护者手动合并。
      - name: Create PR if changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "chore: 更新贡献者名单"
          title: "chore: update contributors"
          body: "PR 合并后自动刷新 CONTRIBUTORS.svg(scripts/update_contributors.py)。"
          branch: chore/update-contributors
          add-paths: CONTRIBUTORS.svg
          delete-branch: true
