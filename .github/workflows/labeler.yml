name: Labeler

# 用 pull_request 而不是 pull_request_target：GitHub 公共仓库从 2026-12-02 起
# 默认阻止 pull_request_target（Issue #1322）。同仓库分支的 PR 能申请到
# pull-requests: write；fork 与 Dependabot 只拿到只读 token，任务直接跳过。
# 本工作流不 checkout、不运行 PR 里的任何代码。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
