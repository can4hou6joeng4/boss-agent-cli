name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        # --locked：下面的产物校验带 --require-clean，uv 改写 uv.lock 会让发布
        # 因为「工作树不干净」失败；锁定安装则保证环境与提交的 lock 完全一致。
        run: uv sync --all-extras --locked

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Build package
        run: uv build

      - name: Verify release artifacts
        # `uv build` 不校验 tag 与 pyproject 版本是否一致，也不检查产物里是否混入
        # 本地文件；这些校验在 scripts/verify_release.py 里，发布前必须先跑。
        run: uv run python scripts/verify_release.py --artifacts dist --tag "${{ github.ref_name }}" --require-clean --json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # 只上传真正的分发产物。此前用 dist/* 会把构建后端生成的 dist/.gitignore
          # 一并捞进去，GitHub 不允许资产以点开头，于是每个 release 都多出一个
          # 名为 default.gitignore 的垃圾文件（v1.15.0 起可见）。
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish to PyPI
        if: ${{ !contains(github.ref, 'rc') && !contains(github.ref, 'beta') }}
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
