[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boss-agent-cli"
version = "1.20.0"
description = "AI Agent 专用的 BOSS 直聘求职 CLI 工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
	{name = "can4hou6joeng4"},
]
keywords = ["boss-zhipin", "job-search", "ai-agent", "cli", "recruitment", "boss直聘"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Console",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Office/Business",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
	"click>=8.0",
	# [socks] 拉的是 socksio（35KB、纯 Python、零传递依赖）。四处 httpx.Client 都用
	# 默认 trust_env=True，即刻意尊重用户的系统代理——对这个项目的目标用户群来说，
	# 常开代理是常态。但 httpx 只有装了 socksio 才支持 socks5:// scheme，否则在
	# **构造 client 时**就抛 ImportError，于是 `ALL_PROXY=socks5://...` 的用户每一条
	# 走 httpx 的命令都失败。CI runner 环境干净、没有代理变量，这条路径在门禁上
	# 永远是绿的（同 fresh_install job 守的那道缝）。
	"httpx[socks]>=0.27",
	"cryptography>=42.0",
	"patchright>=1.58.2",
	"browser-cookie3>=0.16.2",
	"rich>=13.0",
	"prompt-toolkit>=3.0.43",
	"pyyaml>=6.0",
	"websockets>=12.0",
	# 使用 2.x 的 CallbackAPIVersion.VERSION2；升级大版本前须验证回调与传输契约。
	"paho-mqtt>=2.1.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/can4hou6joeng4/boss-agent-cli"
Repository = "https://github.com/can4hou6joeng4/boss-agent-cli"
Issues = "https://github.com/can4hou6joeng4/boss-agent-cli/issues"

[project.optional-dependencies]
dev = [
	"pytest>=9.0.3",
	"pytest-cov>=5.0",
	"ruff>=0.4",
	"pre-commit>=3.0",
	"mypy>=1.20",
	"types-PyYAML>=6.0",
]
bridge = [
	"aiohttp>=3.9",
]
mcp = [
	# 下界 2.1.0、上界 <3.0.0 都是必须的。
	#
	# 下界：mcp 2.0 移除了 `@server.list_tools()` / `@server.call_tool()` 装饰器，
	# 改为 `add_request_handler(method, params_type, handler)`，且 handler 签名与返回
	# 类型一并改变（`(ctx, params)` → `ListToolsResult` / `CallToolResult`）。
	# `mcp_server` 已按 2.x 写，装到 1.x 会在模块层 `AttributeError:
	# 'Server' object has no attribute 'add_request_handler'`。
	#
	# 上界：2.x 是当前已适配并验证过的大版本。3.0 大概率再次重写 Server API——
	# 上一次（1.x → 2.x）的教训是：声明无上界时所有全新安装都会解析到新大版本并崩溃，
	# 而 CI 走 uv.lock 里钉死的旧版本，永远看不到。这正是「门禁看到的和用户拿到的
	# 不是一个东西」，也是 CI 里 fresh_install job（刻意不走 uv.lock）存在的理由。
	"mcp>=2.1.0,<3.0.0",
]
crawl = [
	"DrissionPage>=4.1.1.1,<4.2",
	"openpyxl>=3.1",
]

[project.scripts]
boss = "boss_agent_cli.main:cli"
boss-mcp = "boss_agent_cli.mcp_server:run"

[tool.hatch.build]
exclude = [
	"/.venv*",
	"/.pytest_cache",
	"/.ruff_cache",
	"/.mypy_cache",
	"/dist",
	"/build",
	"/demo/**/*.mp4",
	"/demo/**/*.gif",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Python files intentionally use tabs. Ruff's indent-width controls visual width.
[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
# 显式钉死规则集，不吃 ruff 的隐式默认值。
#
# 此前没有这一段，门禁实际由「当前装的 ruff 版本认为默认是什么」决定：升到
# 0.16.0 时默认集扩展到 I / BLE / RUF / UP / DTZ / S / PYI 等家族，同一份代码
# 凭空多出 344 条报错——质量门禁的定义权不该握在依赖版本手里。
#
# 这里保持与 0.16 之前一致的 pycodestyle 子集 + Pyflakes。要新增规则家族请单独
# 提 PR，连同一次性修复一起评审，而不是让它随版本漂移进来。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "tab"

[tool.mypy]
python_version = "3.10"
# 渐进接入：仅跑基础类型检查，允许现有未注解函数存在
# 目标：先覆盖报错→逐模块消化→最终切 --strict
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
	"^build/",
	"^dist/",
	"^\\.venv/",
]

# 逐模块严格化：已覆盖率 100% 的核心工具模块先严起来
